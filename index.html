<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tarfex Bridge Battle</title>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.12.16/dist/framer-motion.umd.js"></script>
  <style>
    body { margin:0; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:black; color:white; font-family:sans-serif; }
    .grid { display:grid; grid-gap:2px; margin-top:20px; }
    .cell { width:40px; height:40px; border:1px solid #555; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; }
    .blue { background:#007bff; }
    .red { background:#ff3333; }
    .winner { box-shadow: 0 0 16px cyan; animation: pulse 1s infinite; }
    @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.15);} 100% {transform: scale(1);} }
    .start-screen { text-align:center; }
    button { margin-top:10px; padding:8px 16px; border-radius:12px; border:none; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="startScreen" class="start-screen">
    <h1>Welcome to Tarfex's Bridge Battle</h1>
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="game" style="display:none;">
    <h2 id="turnText"></h2>
    <div id="grid" class="grid"></div>
    <div id="winnerText" style="margin-top:10px;"></div>
    <button onclick="resetGame()">Reset Game</button>
  </div>

<script>
  const GRID_SIZE = 8;
  let grid = [];
  let player = 1;
  let winner = null;

  function createGrid() {
    grid = Array(GRID_SIZE).fill().map(()=>Array(GRID_SIZE).fill(0));
  }

  function startGame() {
    document.getElementById('startScreen').style.display='none';
    document.getElementById('game').style.display='block';
    createGrid();
    renderGrid();
    updateTurnText();
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 40px)`;
    gridEl.innerHTML='';
    for(let r=0;r<GRID_SIZE;r++){
      for(let c=0;c<GRID_SIZE;c++){
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if(grid[r][c]===1) cell.classList.add('blue');
        if(grid[r][c]===2) cell.classList.add('red');
        if(winner && grid[r][c]===winner) cell.classList.add('winner');
        cell.onclick = ()=>handleClick(r,c);
        gridEl.appendChild(cell);
      }
    }
  }

  function handleClick(r,c){
    if(grid[r][c] || winner) return;
    grid[r][c] = player;
    if(checkWin(player)){
      winner = player;
      document.getElementById('winnerText').innerText = `Player ${player} Wins ⚡`;
    } else {
      player = player===1?2:1;
      updateTurnText();
    }
    renderGrid();
  }

  function updateTurnText() {
    document.getElementById('turnText').innerText = `Player ${player}'s Turn`;
  }

  function resetGame() {
    createGrid();
    player = 1;
    winner = null;
    document.getElementById('winnerText').innerText='';
    updateTurnText();
    renderGrid();
  }

  function checkWin(p){
    const visited = new Set();
    const dfs = (r,c)=>{
      const key = r+'-'+c;
      if(visited.has(key)) return false;
      visited.add(key);
      if(p===1 && r===GRID_SIZE-1) return true;
      if(p===2 && c===GRID_SIZE-1) return true;
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(let [dr,dc] of dirs){
        let nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE && grid[nr][nc]===p){
          if(dfs(nr,nc)) return true;
        }
      }
      return false;
    }
    if(p===1){
      for(let c=0;c<GRID_SIZE;c++) if(grid[0][c]===p && dfs(0,c)) return true;
    } else {
      for(let r=0;r<GRID_SIZE;r++) if(grid[r][0]===p && dfs(r,0)) return true;
    }
    return false;
  }
</script>
</body>
</html>
